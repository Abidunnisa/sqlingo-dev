<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SQLingo — Learn SQL Like a Language</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#0D9488;--teal-light:#E1F5EE;--teal-mid:#5DCAA5;--teal-dark:#085041;--teal-deep:#0F6E56;
  --bg:#f7faf9;--surface:#ffffff;--surface2:#f0f7f5;--border:#d1e8e2;
  --text:#1a2e2a;--muted:#5a7a72;--muted-light:#8faaa4;
  --correct-bg:#E1F5EE;--correct-border:#5DCAA5;--correct-text:#085041;
  --wrong-bg:#fff0f0;--wrong-border:#f5a0a0;--wrong-text:#8b2020;
  --yellow-bg:#fff8e1;--yellow-border:#ffc107;--yellow-text:#856404;
  --radius:14px;--radius-sm:8px;
}
html,body{background:#f7faf9 !important;color:#1a2e2a !important;font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;font-size:16px;line-height:1.6;}
.screen{display:none;min-height:100vh;flex-direction:column;background:#f7faf9;}
.screen.active{display:flex;}

/* HOME */
#home{padding:32px 24px 48px;align-items:center;}
.wordmark{font-size:36px;font-weight:800;color:var(--teal);letter-spacing:-1px;margin-bottom:4px;text-align:center;}
.wordmark span{color:var(--teal-dark);}
.tagline{font-size:14px;color:var(--muted);margin-bottom:32px;text-align:center;font-weight:500;}
.stats-row{display:flex;gap:12px;width:100%;max-width:400px;margin-bottom:24px;}
.stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;color:var(--teal);}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
.module-tabs{display:flex;gap:8px;width:100%;max-width:400px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
.module-tab{padding:8px 16px;border-radius:100px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all 0.2s;}
.module-tab.active{background:var(--teal);color:white;border-color:var(--teal);}
.module-tab.locked{opacity:0.4;cursor:not-allowed;}
.module-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:24px;max-width:400px;width:100%;margin-bottom:16px;}
.module-tag{display:inline-flex;align-items:center;gap:6px;background:var(--teal-light);border-radius:100px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--teal-deep);margin-bottom:14px;}
.module-name{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;}
.module-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
.progress-wrap{width:100%;max-width:400px;margin-bottom:28px;}
.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.progress-track{height:10px;background:var(--teal-light);border-radius:100px;overflow:hidden;}
.progress-bar{height:100%;background:var(--teal);border-radius:100px;transition:width 1s ease;width:0%;}
.lesson-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);}
.lesson-dot{width:28px;height:28px;border-radius:50%;background:var(--teal-light);border:1.5px solid var(--teal-mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--teal-deep);flex-shrink:0;}
.lesson-dot.done{background:var(--teal);border-color:var(--teal-dark);color:white;}
.lesson-name{font-size:14px;font-weight:600;color:var(--text);}
.lesson-meta{margin-left:auto;font-size:11px;color:var(--muted-light);font-weight:600;}
.btn-start{width:100%;padding:16px;background:var(--teal);color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;}
.btn-start:hover{background:var(--teal-deep);}
.btn-start:disabled{background:var(--border);color:var(--muted-light);cursor:not-allowed;}

/* LESSON */
#lesson{padding:0;}
.lesson-header{background:var(--surface);border-bottom:1.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;}
.btn-back{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.btn-back:hover{background:var(--surface2);}
.header-track{flex:1;height:8px;background:var(--teal-light);border-radius:100px;overflow:hidden;}
.header-fill{height:100%;background:var(--teal);border-radius:100px;transition:width 0.5s ease;}
.xp-chip{background:var(--teal-light);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:800;color:var(--teal-deep);white-space:nowrap;}
.lesson-body{flex:1;padding:24px 20px 40px;max-width:520px;margin:0 auto;width:100%;}
.lesson-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
.lesson-heading{font-size:26px;font-weight:800;color:var(--text);margin-bottom:28px;line-height:1.2;}

/* STORY */
.story-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px;}
.story-emoji{font-size:36px;margin-bottom:14px;}
.story-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:10px;}
.story-body{font-size:15px;color:var(--muted);line-height:1.7;}
.story-body strong{color:var(--text);font-weight:700;}
.story-body code{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--teal);background:var(--teal-light);padding:2px 7px;border-radius:5px;}
.table-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.table-chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.tci{font-size:18px;margin-bottom:4px;}
.tcn{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);font-weight:600;}
.tcd{font-size:11px;color:var(--muted);margin-top:2px;}
.code-block{font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;line-height:1.8;color:var(--text);}
.code-block .kw{color:var(--teal);font-weight:600;}
.code-block .val{color:#b45309;}

/* ACTIVITY */

.act-type{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:10px;}
.act-q{font-size:16px;color:var(--text);line-height:1.6;margin-bottom:20px;font-weight:600;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{padding:14px 16px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);font-size:15px;color:var(--text);cursor:pointer;transition:all 0.18s;text-align:left;font-family:'Nunito',sans-serif;font-weight:600;display:flex;align-items:center;gap:10px;}
.opt:hover{border-color:var(--teal);background:var(--teal-light);}
.opt.correct{border-color:var(--correct-border) !important;background:var(--correct-bg) !important;color:var(--correct-text) !important;}
.opt.wrong{border-color:var(--wrong-border) !important;background:var(--wrong-bg) !important;color:var(--wrong-text) !important;}
.opt.disabled{pointer-events:none;opacity:0.5;}
.opt.disabled.correct{opacity:1;}
.opt-ic{font-size:15px;flex-shrink:0;}

/* DRAG */
.drop-zone{min-height:54px;border:2px dashed var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;transition:border-color 0.2s;background:var(--surface2);}
.drop-zone.correct-zone{border-color:var(--correct-border);background:var(--correct-bg);}
.drop-zone.wrong-zone{border-color:var(--wrong-border);background:var(--wrong-bg);}
.zone-hint{font-size:13px;color:var(--muted-light);font-weight:600;}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.drag-word{padding:8px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);cursor:pointer;user-select:none;transition:all 0.15s;font-weight:600;}
.drag-word:hover{border-color:var(--teal);background:var(--teal-light);transform:translateY(-2px);}
.drag-word.used{opacity:0.25;pointer-events:none;}
.placed-word{padding:6px 12px;background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--teal-deep);cursor:pointer;font-weight:600;}

/* FILL */
.code-template{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;line-height:1.8;}
.blank-span{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--teal);color:var(--teal);text-align:center;font-weight:700;}
.fill-input{width:100%;padding:13px 16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--text);outline:none;transition:border-color 0.2s;font-weight:600;}
.fill-input:focus{border-color:var(--teal);}
.fill-input.correct-input{border-color:var(--correct-border);background:var(--correct-bg);color:var(--correct-text);}
.fill-input.wrong-input{border-color:var(--wrong-border);background:var(--wrong-bg);color:var(--wrong-text);}

/* FEEDBACK */
.feedback{border-radius:var(--radius);padding:16px 18px;margin-top:14px;display:none;gap:12px;align-items:flex-start;}
.feedback.show{display:flex;}
.feedback.correct-fb{background:var(--correct-bg);border:1.5px solid var(--correct-border);}
.feedback.wrong-fb{background:var(--wrong-bg);border:1.5px solid var(--wrong-border);}
.fb-icon{font-size:20px;flex-shrink:0;}
.fb-title{font-size:14px;font-weight:800;margin-bottom:3px;}
.feedback.correct-fb .fb-title{color:var(--correct-text);}
.feedback.wrong-fb .fb-title{color:var(--wrong-text);}
.fb-body{font-size:13px;line-height:1.6;color:var(--muted);}
.fb-body code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--teal-light);color:var(--teal-deep);padding:1px 6px;border-radius:4px;}

/* INFO BUTTON */
.info-btn{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--teal-light);border:1.5px solid var(--teal-mid);color:var(--teal-deep);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.info-btn:hover{background:var(--teal);color:white;}
.info-panel{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:none;}
.info-panel.show{display:block;}
.info-panel-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal-deep);font-weight:700;margin-bottom:8px;}
.info-panel-body{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal-dark);line-height:1.8;}
.activity-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;position:relative;}

/* TEST SCREEN */
.test-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;margin-top:12px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.test-btn:hover{opacity:0.9;transform:translateY(-1px);}
.test-btn:disabled{background:var(--border);color:var(--muted-light);cursor:not-allowed;transform:none;}
.test-progress{font-size:13px;color:var(--muted);font-weight:600;text-align:center;margin-bottom:16px;}
.test-result-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:28px;max-width:400px;width:100%;margin:0 auto 24px;text-align:center;}
.test-score{font-family:'DM Serif Display',serif;font-size:64px;font-weight:700;color:var(--teal);}
.test-score.fail{color:var(--wrong-text);}
.test-score-label{font-size:14px;color:var(--muted);margin-top:4px;font-weight:600;}
.wrong-review{background:var(--wrong-bg);border:1.5px solid var(--wrong-border);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-align:left;}
.wrong-review-q{font-size:13px;font-weight:700;color:var(--wrong-text);margin-bottom:6px;}
.wrong-review-correct{font-size:12px;color:var(--muted);}
.wrong-review-correct span{color:var(--correct-text);font-weight:700;}

/* RETRY BANNER */
.retry-banner{background:var(--yellow-bg);border:1.5px solid var(--yellow-border);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:700;color:var(--yellow-text);display:flex;gap:10px;align-items:center;}

/* BUTTONS */
.btn-check{width:100%;padding:15px;background:var(--teal);color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;margin-top:16px;transition:all 0.2s;display:none;}
.btn-check.show{display:block;}
.btn-check:hover{background:var(--teal-deep);}
.btn-check:disabled{background:var(--border);color:var(--muted-light);cursor:not-allowed;}
.btn-next{width:100%;padding:15px;background:white;color:var(--teal);border:2px solid var(--teal);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border-radius:var(--radius);cursor:pointer;margin-top:10px;transition:all 0.2s;display:none;}
.btn-next.show{display:block;}
.btn-next:hover{background:var(--teal-light);}
.btn-continue{width:100%;padding:15px;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border-radius:var(--radius);cursor:pointer;margin-top:16px;transition:all 0.2s;}
.btn-continue:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal-deep);}

/* COMPLETE */
#complete{align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
.complete-emoji{font-size:72px;margin-bottom:20px;animation:pop 0.5s ease;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.complete-title{font-size:32px;font-weight:800;color:var(--text);margin-bottom:6px;}
.complete-sub{font-size:16px;color:var(--muted);margin-bottom:36px;max-width:300px;line-height:1.6;}
.xp-earned-card{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:20px;padding:28px;max-width:300px;width:100%;margin:0 auto 28px;}
.xp-earned-val{font-size:52px;font-weight:800;color:var(--teal);}
.xp-earned-lbl{font-size:14px;color:var(--teal-deep);margin-top:4px;font-weight:700;}
.btn-home{padding:15px 40px;background:var(--teal);color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;}
.btn-home:hover{background:var(--teal-deep);}
</style>
</head>
<body>

<div class="screen active" id="home">
  <div class="wordmark">SQL<span>ingo</span></div>
  <div class="tagline">Learn SQL like a language</div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="xp-display">0</div><div class="stat-lbl">Total XP</div></div>
    <div class="stat-card"><div class="stat-val" id="streak-display">1 🔥</div><div class="stat-lbl">Streak</div></div>
    <div class="stat-card"><div class="stat-val" id="done-display">0</div><div class="stat-lbl">Lessons Done</div></div>
  </div>

  <div class="module-tabs" id="module-tabs"></div>

  <div class="progress-wrap">
    <div class="progress-label"><span id="mod-progress-label">Module 1 progress</span><span id="progress-pct">0%</span></div>
    <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
  </div>

  <div class="module-card" id="module-card"></div>
</div>

<div class="screen" id="lesson">
  <div class="lesson-header">
    <button class="btn-back" onclick="goHome()" aria-label="Back">←</button>
    <div class="header-track"><div class="header-fill" id="header-fill" style="width:0%"></div></div>
    <div class="xp-chip">⚡ <span id="session-xp">0</span> XP</div>
  </div>
  <div class="lesson-body" id="lesson-body"></div>
</div>

<div class="screen" id="test">
  <div class="lesson-header">
    <button class="btn-back" onclick="goHome()" aria-label="Back">←</button>
    <div class="header-track"><div class="header-fill" id="test-fill" style="width:0%"></div></div>
    <div class="xp-chip">Q <span id="test-q-num">1</span>/<span id="test-q-total">20</span></div>
  </div>
  <div class="lesson-body" id="test-body"></div>
</div>

<div class="screen" id="test-result">
  <div style="padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;">
    <div style="font-size:64px;margin-bottom:16px;" id="result-emoji">🎉</div>
    <div style="font-size:28px;font-weight:800;color:var(--text);margin-bottom:8px;" id="result-title">Module Complete!</div>
    <div style="font-size:15px;color:var(--muted);margin-bottom:32px;max-width:300px;line-height:1.6;" id="result-msg"></div>
    <div class="test-result-card">
      <div class="test-score" id="result-score">18/20</div>
      <div class="test-score-label">Questions correct</div>
    </div>
    <div style="width:100%;max-width:400px;margin-bottom:24px;" id="wrong-answers-wrap">
      <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px;text-align:left;">What to review:</div>
      <div id="wrong-answers-list"></div>
    </div>
    <button class="btn-start" id="result-btn" onclick="handleResultBtn()" style="max-width:400px;width:100%;"></button>
    <button class="btn-next show" onclick="goHome()" style="max-width:400px;width:100%;margin-top:10px;">Back to home</button>
  </div>
</div>

<div class="screen" id="complete">
  <div class="complete-emoji">🎉</div>
  <div class="complete-title">You did it!</div>
  <div class="complete-sub" id="complete-msg">Keep going.</div>
  <div class="xp-earned-card">
    <div class="xp-earned-val" id="earned-val">+80</div>
    <div class="xp-earned-lbl">XP earned this lesson</div>
  </div>
  <button class="btn-home" onclick="goHome()">Back to home</button>
</div>

<script>
const S={
  xp:parseInt(localStorage.getItem('sq_xp')||0),
  streak:parseInt(localStorage.getItem('sq_streak')||1),
  totalDone:parseInt(localStorage.getItem('sq_total_done')||0),
  modDone:JSON.parse(localStorage.getItem('sq_mod_done')||'[0,0]'),
  currentMod:0,
  currentLesson:0,
  currentStep:0,
  sxp:0
};

const modules=[
  {
    name:"SELECT & FROM",
    desc:"Start here. No jargon, no videos. Just you, a store called Sakila, and your first SQL query.",
    lessons:[
      {
        title:"Meet the Database",
        msg:"You now know what the Sakila store looks like. Next up — asking your first question from it.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">📼</div>
              <div class="story-title">Before Netflix, there was the DVD store.</div>
              <div class="story-body">
                Before OTT platforms like Netflix existed, people used to rent movies on DVDs from a physical store. You would walk in, pick a movie, pay for it, and return it a few days later.<br><br>
                <strong>Sakila is one such store.</strong> It is a real practice database used by SQL learners worldwide — and we will use it throughout SQLingo.<br><br>
                Every store keeps records. Sakila keeps its records in <strong>tables</strong> — think of each table like a spreadsheet with rows and columns.
                <div class="table-grid">
                  <div class="table-chip"><div class="tci">🎬</div><div class="tcn">film</div><div class="tcd">Every movie in the store</div></div>
                  <div class="table-chip"><div class="tci">👤</div><div class="tcn">customer</div><div class="tcd">People who rent</div></div>
                  <div class="table-chip"><div class="tci">📋</div><div class="tcn">rental</div><div class="tcd">Every rental made</div></div>
                  <div class="table-chip"><div class="tci">💰</div><div class="tcn">payment</div><div class="tcd">Payments received</div></div>
                </div>
                <br><strong>All these tables together — that is a database.</strong> Think of it as a digital filing cabinet for a business.
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Got it, lets go →</button>
          `},
          {type:'choice',q:'Sakila is a DVD rental store. Where does it keep all its information?',opts:['In a folder on a laptop','In a database made up of tables','In a spreadsheet emailed every day','In a notebook at the counter'],correct:1,fb:{correct:{t:"Exactly!",b:"A database is an organised collection of tables. Each table stores a specific type of information — movies, customers, rentals, payments."},wrong:{t:"Not quite — think about it",b:"A database is an organised collection of tables. Each table stores a specific type of information — movies, customers, rentals, payments."}}},

      {
        title:"Common Mistakes",
        msg:"You now know what SQL cares about and what it does not. That will save you a lot of frustration.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">⚠️</div>
              <div class="story-title">SQL is relaxed about some things. Very strict about others.</div>

                Good news — SQL does not care about uppercase or lowercase. <code>select</code>, <code>SELECT</code>, <code>Select</code> — all work exactly the same.<br><br>

                <strong>Spellings</strong> — type <code>films</code> instead of <code>film</code> and you will get an error. One extra letter breaks everything.<br><br>
                <strong>Spaces in names</strong> — if a column is called <code>first_name</code>, you cannot write <code>first name</code> with a space. The underscore is part of the name. Use it exactly as it appears.<br><br>
                <strong>Spaces between keywords</strong> — there must be a space between SELECT and your column name, and between FROM and your table name.<br><br>
                Let us make sure these stick.
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Let us test this →</button>

          {type:'choice',q:"True or false — in SQL, SELECT and select do exactly the same thing.",opts:["True — cases do not matter in SQL","False — you must always use UPPERCASE"],correct:0,fb:{correct:{t:"True! SQL does not care about case.",b:"SELECT, select, Select — all work the same. Most people write keywords in uppercase just to make queries easier to read. But SQL does not require it."},wrong:{t:"Actually it is True!",b:"SQL keywords are case-insensitive. SELECT and select do the exact same thing."}}},

          {type:'choice',q:'A column is called rental_rate. Which version will cause an error in your query?',opts:['rental_rate','rental rate','Rental_Rate','RENTAL_RATE'],correct:1,fb:{correct:{t:"Yes — the space breaks it!",b:"rental rate with a space causes an error. SQL sees it as two separate words and gets confused. Always use the underscore: rental_rate. Cases do not matter — rental_rate, Rental_Rate, RENTAL_RATE all work fine."},wrong:{t:"Think about what SQL is strict about",b:"SQL does not care about cases. rental_rate, Rental_Rate, RENTAL_RATE all work. What SQL cannot handle is a space inside a name. rental rate breaks everything."}}},
          {type:'choice',q:'Which of these queries is written correctly?',opts:['SELECTtitle FROM film','SELECT title FROMfilm','SELECT title FROM film','SELECT, title FROM film'],correct:2,fb:{correct:{t:"That is the one.",b:"A space between every keyword and name — SELECT space title space FROM space film. Remove any space and the query breaks."},wrong:{t:"Look at the spaces carefully",b:"There must be a space between SELECT and the column name, and between FROM and the table name. The correct version: SELECT title FROM film"}}},
          {type:'choice',q:'True or false — SELECT Title FROM Film works the same as SELECT title FROM film.',opts:['True — cases do not matter','False — you must use lowercase for table and column names'],correct:0,fb:{correct:{t:"True!",b:"Cases do not matter anywhere in a SQL query — keywords, table names, column names. SQL is completely case-insensitive."},wrong:{t:"Actually True!",b:"SQL is case-insensitive everywhere — keywords AND names. SELECT Title FROM Film is identical to SELECT title FROM film."}}},

          {type:'fill',q:'A column is called last_name. Complete this query to get it from the customer table.',template:'SELECT ___ FROM customer',answer:'last_name',fb:{correct:{t:"Perfect — underscore and all.",b:"last_name — exactly as the column is named. Always use the column name exactly as it appears in the table, underscore included."},wrong:{t:"Remember the underscore",b:"The column name is last_name — with an underscore connecting the two words. No space allowed."}}},
          {type:'choice',q:'Which of these mistakes will definitely cause an error in SQL?',opts:['Writing SELECT in lowercase','Leaving a space in a column name like first name instead of first_name','Writing the table name in uppercase','Using a comma between column names'],correct:1,fb:{correct:{t:"That is the one to watch out for!",b:"Spaces inside column or table names break SQL completely. first name is not the same as first_name. Always use underscore to join words in names."},wrong:{t:"Think about what SQL is strict about",b:"SQL does not care about case — uppercase, lowercase, it is fine. But spaces inside names are a problem. first name breaks the query. first_name is correct."}}}

  {
    name:"WHERE & Operators",
    desc:"Filter your data like you filter products on Amazon. Single conditions, multiple conditions, and everything in between.",
    lessons:[
      {
        title:"What is WHERE?",
        msg:"You can now filter data like a pro. WHERE is your most used SQL keyword — you just learned it.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">🛒</div>
              <div class="story-title">You already know how WHERE works. You use it every time you shop online.</div>
              <div class="story-body">
                When you open Amazon, you do not scroll through every single product. You use <strong>filters</strong>.<br><br>
                Price under ₹500. Rating above 4 stars. Brand: Nike.<br><br>
                <strong>WHERE does exactly the same thing for your database.</strong> Instead of getting every row from a table, you filter — show me only the rows that match my condition.<br><br>
                <code>SELECT column FROM table WHERE condition</code><br><br>
                Single filter = one WHERE condition.<br>
                Multiple filters = AND, OR — just like checking multiple boxes on Amazon.<br><br>
                You already know how this works. Now let us say it in SQL.
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Let us go →</button>
          `},
          {type:'choice',q:'On Amazon you filter products by price under ₹500. What is the SQL equivalent of this filter?',opts:['SELECT * FROM products ORDER BY price','SELECT * FROM products WHERE price < 500','SELECT price FROM products LIMIT 500','SELECT * FROM products HAVING price < 500'],correct:1,fb:{correct:{t:"Exactly!",b:"WHERE price < 500 filters rows just like an Amazon price filter. Only rows where the price is less than 500 will appear in the results."},wrong:{t:"Think about filtering",b:"WHERE is the filter in SQL. WHERE price < 500 means show me only the rows where price is less than 500 — just like an Amazon price filter."}}},
          {type:'choice',q:'WHERE goes after which part of the query?',opts:['Before SELECT','After SELECT but before FROM','After FROM and the table name','At the very end of every query'],correct:2,fb:{correct:{t:"Correct!",b:"The order is always SELECT → FROM → WHERE. You tell SQL what you want, where to get it from, and then which ones to show you."},wrong:{t:"Remember the order",b:"SQL reads in this order: SELECT (what you want) → FROM (which table) → WHERE (which rows). So WHERE always comes after the table name."}}},
          {type:'drag',q:'Arrange this query to get films with a rental rate less than 3.',words:['film','FROM','SELECT','WHERE','*','rental_rate < 3'],correct:['SELECT','*','FROM','film','WHERE','rental_rate < 3'],fb:{correct:{t:"Perfect!",b:"SELECT * FROM film WHERE rental_rate < 3 — every column, from the film table, but only the rows where rental rate is less than 3."},wrong:{t:"Remember the order",b:"It goes: SELECT what you want, FROM which table, WHERE which condition. SELECT * FROM film WHERE rental_rate < 3"}}},
          {type:'choice',q:'You run SELECT * FROM film WHERE rental_rate = 4.99. What does this return?',opts:['All films in the table','Only films where rental rate is exactly 4.99','Films where rental rate is less than 4.99','Films sorted by rental rate'],correct:1,fb:{correct:{t:"Yes!",b:"The = operator checks for an exact match. Only rows where rental_rate is exactly 4.99 will be returned."},wrong:{t:"Think about what = means",b:"= means exactly equal to. So WHERE rental_rate = 4.99 returns only the rows where the rental rate is exactly 4.99."}}},
          {type:'choice',q:'On Amazon you can filter by multiple things at once — price AND rating. In SQL, how do you add multiple conditions to WHERE?',opts:['Write two separate WHERE clauses','Use AND or OR between conditions','Use a comma between conditions','Use + between conditions'],correct:1,fb:{correct:{t:"Correct!",b:"AND and OR let you combine multiple conditions in one WHERE clause — just like checking multiple filter boxes on Amazon."},wrong:{t:"Think about how Amazon filters work",b:"You can only have one WHERE keyword — but you can combine conditions using AND or OR. WHERE price < 500 AND rating > 4."}}},
          {type:'choice',q:'True or false — you can use WHERE without SELECT.',opts:['True — WHERE works on its own','False — WHERE only works inside a complete SQL query'],correct:1,fb:{correct:{t:"Correct!",b:"WHERE is not a standalone command. It only works as part of a SELECT query — SELECT → FROM → WHERE."},wrong:{t:"Actually False!",b:"WHERE cannot work on its own. It always needs to be part of a complete query — SELECT columns FROM table WHERE condition."}}},
          {type:'fill',q:'Complete this query to get all columns from the film table where the rating is G.',template:"SELECT * FROM film WHERE rating ___ 'G'",answer:'=',fb:{correct:{t:"Perfect!",b:"= is the equality operator. WHERE rating = 'G' means show me only the rows where rating is exactly G."},wrong:{t:"The operator you need is =",b:"= checks for exact match. WHERE rating = 'G' returns only films rated G."}}},
          {type:'choice',q:'Which of these is a valid WHERE clause?',opts:["WHERE = rating 'G'","WHERE rating 'G'","WHERE rating = 'G'","FILTER rating = 'G'"],correct:2,fb:{correct:{t:"That is it!",b:"WHERE rating = 'G' — WHERE keyword, then column name, then operator, then value. That is the correct structure."},wrong:{t:"Check the structure",b:"WHERE needs to be followed by: column name, then operator, then value. The correct version is WHERE rating = 'G'."}}}
        ]
      },
      {
        title:"Comparison Operators",
        msg:"Comparison operators are the building blocks of every WHERE clause. You now know all of them.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">⚖️</div>
              <div class="story-title">Comparison operators — how you compare values in SQL.</div>
              <div class="story-body">
                Just like in maths, SQL has operators to compare values:<br><br>
                <code>=</code> &nbsp;Equal to<br>
                <code>!=</code> or <code>&lt;&gt;</code> &nbsp;Not equal to<br>
                <code>&gt;</code> &nbsp;Greater than<br>
                <code>&lt;</code> &nbsp;Less than<br>
                <code>&gt;=</code> &nbsp;Greater than or equal to<br>
                <code>&lt;=</code> &nbsp;Less than or equal to<br><br>
                You use these after WHERE to define your filter condition.<br><br>
                On Amazon — price is less than ₹500 means <code>price &lt; 500</code><br>
                Rating is 4 stars or more means <code>rating &gt;= 4</code>
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Got it →</button>
          `},
          {type:'choice',q:'You want films where the rental rate is MORE than 2.99. Which operator do you use?',opts:['=','>=','>','<'],correct:2,fb:{correct:{t:"Yes! > means strictly greater than.",b:"WHERE rental_rate > 2.99 returns only films where rental rate is more than 2.99. Films with exactly 2.99 will NOT be included."},wrong:{t:"Think carefully",b:"> means strictly greater than — does not include 2.99 itself. >= means greater than OR equal to — includes 2.99. You want strictly more than, so use >."}}},
          {type:'choice',q:'You want films where the rental rate is 2.99 OR MORE. Which operator do you use?',opts:['>','>=','=','<='],correct:1,fb:{correct:{t:"Correct! >= includes the value itself.",b:"WHERE rental_rate >= 2.99 returns films where rental rate is 2.99 or anything above it. The = in >= means include the value itself."},wrong:{t:"Think about or more",b:">= means greater than OR equal to. It includes the value you specify. > without = would exclude 2.99 itself."}}},
          {type:'choice',q:'Which operator checks if two values are NOT equal?',opts:['=','<>','>','<='],correct:1,fb:{correct:{t:"Yes! <> means not equal.",b:"<> and != both mean not equal to. WHERE rating <> 'G' returns all films that are NOT rated G. Both operators work the same way."},wrong:{t:"Not quite",b:"<> means not equal to. It is the same as !=. WHERE rating <> 'G' returns everything except G-rated films."}}},
          {type:'fill',q:"Complete this query to find all films that are NOT rated PG.",template:"SELECT title FROM film WHERE rating ___ 'PG'",answer:['!=','<>'],fb:{correct:{t:"Perfect!",b:"!= means not equal to. WHERE rating != 'PG' returns all films where the rating is anything other than PG. You can also use <> — both work exactly the same."},wrong:{t:"The operator you need is != or <>",b:"Both != and <> mean not equal to in SQL. Either one works. WHERE rating != 'PG' or WHERE rating <> 'PG' both return everything except PG-rated films."}}},
          {type:'choice',q:'You want films with a rental duration of 5 days or LESS. Which query is correct?',opts:["SELECT * FROM film WHERE rental_duration > 5","SELECT * FROM film WHERE rental_duration < 5","SELECT * FROM film WHERE rental_duration <= 5","SELECT * FROM film WHERE rental_duration >= 5"],correct:2,fb:{correct:{t:"Yes! <= includes 5 itself.",b:"<= means less than or equal to. WHERE rental_duration <= 5 returns films with duration of exactly 5 or anything below it."},wrong:{t:"Think about or less",b:"<= means less than OR equal to — it includes the value itself. < would exclude 5. You want 5 or less, so use <=."}}},
          {type:'choice',q:'What does WHERE rental_rate = 0.99 return?',opts:['All films in the table','Films where rental rate is less than 0.99','Only films where rental rate is exactly 0.99','Films where rental rate is 0.99 or more'],correct:2,fb:{correct:{t:"Exactly!",b:"= is an exact match. Only rows where rental_rate is precisely 0.99 will be returned. Not 1.99, not 0.98 — exactly 0.99."},wrong:{t:"Remember what = means",b:"= means exactly equal to. WHERE rental_rate = 0.99 returns only rows where the rental rate is precisely 0.99."}}},
          {type:'drag',q:'Build a query to find all films with a replacement cost greater than 20.',words:['*','SELECT','WHERE','film','FROM','replacement_cost > 20'],correct:['SELECT','*','FROM','film','WHERE','replacement_cost > 20'],fb:{correct:{t:"Great!",b:"SELECT * FROM film WHERE replacement_cost > 20 — all columns, from the film table, only where replacement cost is more than 20."},wrong:{t:"Remember the order",b:"SELECT → FROM → WHERE. Build it as: SELECT * FROM film WHERE replacement_cost > 20"}}},
          {type:'choice',q:'Which operator would you use to find customers whose last name comes before M alphabetically?',opts:['>','<','>=','<='],correct:1,fb:{correct:{t:"Yes! < works on text too.",b:"Comparison operators work on text as well — SQL compares alphabetically. WHERE last_name < 'M' returns names that come before M alphabetically."},wrong:{t:"Comparison operators work on text too",b:"< works on text — SQL compares alphabetically. WHERE last_name < 'M' returns all customers whose last name starts with a letter before M."}}}
        ]
      },
      {
        title:"Arithmetic Operators",
        msg:"You can now do math inside SQL queries. Arithmetic operators open up a whole new level of data analysis.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">🧮</div>
              <div class="story-title">SQL can do maths. Right inside your query.</div>
              <div class="story-body">
                You are not limited to just reading values from a table. You can calculate directly in your query.<br><br>
                <code>+</code> &nbsp;Addition<br>
                <code>-</code> &nbsp;Subtraction<br>
                <code>*</code> &nbsp;Multiplication<br>
                <code>/</code> &nbsp;Division<br>
                <code>%</code> &nbsp;Modulus — the remainder after division<br><br>
                You can use arithmetic in SELECT to create calculated columns:<br>
                <div class="code-block"><span class="kw">SELECT</span> title, rental_rate * <span class="val">2</span> <span class="kw">FROM</span> film</div>
                And in WHERE to filter by calculated values:<br>
                <div class="code-block"><span class="kw">SELECT</span> * <span class="kw">FROM</span> film <span class="kw">WHERE</span> rental_rate * <span class="val">2</span> > <span class="val">5</span></div>
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Let me try →</button>
          `},
          {type:'choice',q:'You want to see the rental rate doubled for every film. Which query does this?',opts:['SELECT title, rental_rate FROM film','SELECT title, rental_rate + 2 FROM film','SELECT title, rental_rate * 2 FROM film','SELECT title, rental_rate / 2 FROM film'],correct:2,fb:{correct:{t:"Yes!",b:"rental_rate * 2 multiplies the rental rate by 2 for every row. The result appears as a calculated column in your output."},wrong:{t:"Think about doubling",b:"To double a value you multiply by 2. rental_rate * 2 gives you the doubled rental rate for every film."}}},
          {type:'choice',q:'What does the % operator do in SQL?',opts:['It represents all columns like SELECT *','It gives the remainder after division','It is used in LIKE for pattern matching','It multiplies two values'],correct:1,fb:{correct:{t:"Correct!",b:"% as an arithmetic operator gives the remainder after division. 10 % 3 = 1 because 10 divided by 3 is 3 remainder 1. Note: % in LIKE is a wildcard — different use, same symbol."},wrong:{t:"% has two uses in SQL",b:"As an arithmetic operator, % gives the remainder after division. 10 % 3 = 1. Note: in LIKE, % is used as a wildcard — that is a different context."}}},
          {type:'fill',q:'Write a query to see each film title and its rental rate with a 10% discount applied.',template:'SELECT title, rental_rate ___ 0.10 FROM film',answer:'*',fb:{correct:{t:"Yes! Multiply to apply a percentage.",b:"rental_rate * 0.10 gives you 10% of the rental rate. To get the discounted price you would do rental_rate - rental_rate * 0.10 — or rental_rate * 0.90."},wrong:{t:"To get 10% of a value, multiply by 0.10",b:"rental_rate * 0.10 gives you 10% of the rental rate. * is the multiplication operator in SQL."}}},

          {type:'story',render:()=>`

              <div class="story-emoji">🎯</div>
              <div class="story-title">Shortcuts that make your queries cleaner.</div>

                Instead of writing long chains of OR conditions, SQL gives you shortcuts:<br><br>
                <strong>IN</strong> — match a list of values<br>
                <div class="code-block"><span class="kw">WHERE</span> rating <span class="kw">IN</span> (<span class="val">'G'</span>, <span class="val">'PG'</span>, <span class="val">'PG-13'</span>)</div>

                <strong>BETWEEN</strong> — a range of values (inclusive)<br>
                <div class="code-block"><span class="kw">WHERE</span> rental_rate <span class="kw">BETWEEN</span> <span class="val">1</span> <span class="kw">AND</span> <span class="val">3</span></div>
                Same as: WHERE rental_rate >= 1 AND rental_rate <= 3<br><br>
                <strong>LIKE</strong> — pattern matching<br>
                <div class="code-block"><span class="kw">WHERE</span> title <span class="kw">LIKE</span> <span class="val">'A%'</span></div>

      {
        title:"IS NULL & IS NOT NULL",
        msg:"NULL is one of the trickiest things in SQL. You now know how to handle it correctly — most people get this wrong.",
        steps:[
          {type:'story',render:()=>`
            <div class="story-card">
              <div class="story-emoji">❓</div>
              <div class="story-title">NULL — the most misunderstood thing in SQL.</div>
              <div class="story-body">
                NULL means <strong>no value</strong>. Not zero. Not an empty string. Nothing.<br><br>
                Think of it like a form where someone left a field blank. The field exists — but there is nothing in it.<br><br>
                <strong>The most important rule about NULL:</strong><br>
                You cannot use = to check for NULL.<br><br>
                <code>WHERE email = NULL</code> — this will NOT work.<br><br>
                You must use:<br>
                <code>WHERE email IS NULL</code> — finds rows with no email<br>
                <code>WHERE email IS NOT NULL</code> — finds rows that have an email<br><br>
                This trips up almost every beginner. Now you know.
              </div>
            </div>
            <button class="btn-continue" onclick="nextStep()">Got it →</button>
          `},
          {type:'choice',q:'What does NULL mean in SQL?',opts:['The number zero','An empty string with no characters','No value — the field is completely empty','The word NULL as text'],correct:2,fb:{correct:{t:"Correct!",b:"NULL means the absence of any value. It is not 0, not an empty string — it is nothing. A field that was never filled in."},wrong:{t:"NULL is not zero or empty string",b:"NULL means no value at all — the field is blank. 0 is a number. An empty string is still a string. NULL is the complete absence of data."}}},

          {type:'choice',q:"A customer record has email = '' (empty string). Does WHERE email IS NULL find this customer?",opts:['Yes — empty string is the same as NULL','No — empty string and NULL are different things','Yes — both mean no email was provided','Depends on the database'],correct:1,fb:{correct:{t:"Correct — they are different!",b:"An empty string '' is still a value — just a string with nothing in it. NULL means no value at all. IS NULL will NOT find rows with empty strings. You would need WHERE email = '' for that."},wrong:{t:"Empty string and NULL are not the same",b:"'' is an empty string — a value that exists but has no characters. NULL means no value at all. IS NULL only finds actual NULLs, not empty strings."}}},

                When you sort a column in Excel — A to Z, newest to oldest, smallest to largest — that is exactly what ORDER BY does in SQL.<br><br>

                Add <code>DESC</code> to reverse it — largest to smallest, Z to A, newest to oldest.<br><br>
                <code>SELECT * FROM film ORDER BY rental_rate DESC</code>

let inRetryMode=false;

function renderStep(){
  const mod=modules[S.currentMod];

  const step=L.steps[S.currentStep];

  document.getElementById('header-fill').style.width=Math.round((S.currentStep/total)*100)+'%';
  const body=document.getElementById('lesson-body');

    h=`<div class="retry-banner"><span>🔁</span><span>You got this one wrong earlier — try it again!</span></div>`+h;
  }
  if(step.type==='story'){body.innerHTML=h+step.render();return;}

    body.innerHTML=h;act={type:'choice',step};return;

    const sh=[...step.words].sort(()=>Math.random()-0.5);

    const hintHtml=hint?`<button class="info-btn" onclick="toggleInfo()" title="Quick reference">ⓘ</button><div class="info-panel" id="info-panel"><div class="info-panel-title">Quick Reference</div><div class="info-panel-body">${hint}</div></div>`:'';

function chkChoice(idx){
  const step=act.step;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  const ok=idx===step.correct;
  document.getElementById('ic'+idx).textContent=ok?'✓':'✗';
  document.getElementById('op'+idx).classList.add(ok?'correct':'wrong');
  if(!ok){
    document.getElementById('op'+step.correct).classList.add('correct');
    document.getElementById('op'+step.correct).classList.remove('disabled');
    document.getElementById('ic'+step.correct).textContent='✓';
    if(!mistakeQueue.includes(S.currentStep))mistakeQueue.push(S.currentStep);
  }
  showFb(ok,step.fb);if(ok)addXP(10);
  const nb=document.getElementById('bnext');
  nb.textContent=ok?'Continue →':'Got it — I will try again →';
  nb.classList.add('show');
}

function tapW(word,idx){
  const el=document.getElementById('dw'+idx);
  if(el.classList.contains('used'))return;
  el.classList.add('used');
  const zone=document.getElementById('dzone'),hint=document.getElementById('zhint');
  if(hint)hint.remove();
  const pw=document.createElement('div');pw.className='placed-word';pw.textContent=word;pw.title='Tap to remove';
  pw.onclick=()=>{pw.remove();el.classList.remove('used');act.placed=act.placed.filter(p=>p.idx!==idx);if(!document.getElementById('dzone').children.length){const h=document.createElement('span');h.className='zone-hint';h.id='zhint';h.textContent='Tap words below to place them here';document.getElementById('dzone').appendChild(h);}};
  zone.appendChild(pw);act.placed.push({word,idx});
}

function chkDrag(){
  const step=act.step,placed=act.placed.map(p=>p.word),ok=JSON.stringify(placed)===JSON.stringify(step.correct);
  document.getElementById('dzone').classList.add(ok?'correct-zone':'wrong-zone');
  document.querySelectorAll('.drag-word').forEach(e=>e.style.pointerEvents='none');
  document.querySelectorAll('.placed-word').forEach(e=>e.style.pointerEvents='none');
  if(!ok&&!mistakeQueue.includes(S.currentStep))mistakeQueue.push(S.currentStep);
  showFb(ok,step.fb);if(ok)addXP(15);
  document.getElementById('bcheck').style.display='none';
  document.getElementById('bnext').classList.add('show');
}

function onType(){document.getElementById('bcheck').disabled=!document.getElementById('fin').value.trim();}

function chkFill(){
  const step=act.step,input=document.getElementById('fin');
  const val=input.value.trim().toLowerCase();
  const answers=Array.isArray(step.answer)?step.answer.map(a=>a.toLowerCase()):[step.answer.toLowerCase()];
  const ok=answers.includes(val);
  input.classList.add(ok?'correct-input':'wrong-input');input.disabled=true;
  if(!ok&&!mistakeQueue.includes(S.currentStep))mistakeQueue.push(S.currentStep);
  showFb(ok,step.fb);if(ok)addXP(10);
  document.getElementById('bcheck').style.display='none';
  document.getElementById('bnext').classList.add('show');
}

function showFb(ok,fb){
  const d=ok?fb.correct:fb.wrong,el=document.getElementById('fb');
  el.className='feedback show '+(ok?'correct-fb':'wrong-fb');
  el.innerHTML=`<div class="fb-icon">${ok?'✅':'❌'}</div><div><div class="fb-title">${d.t}</div><div class="fb-body">${d.b}</div></div>`;
}

function addXP(n){S.sxp+=n;document.getElementById('session-xp').textContent=S.sxp;}

function nextStep(){
  const mod=modules[S.currentMod];
  const L=mod.lessons[S.currentLesson];
  if(inRetryMode){
    if(mistakeQueue.length>0){
      S.currentStep=mistakeQueue.shift();
      renderStep();window.scrollTo(0,0);
    } else {
      inRetryMode=false;
      completeLesson();
    }
    return;
  }
  S.currentStep++;
  if(S.currentStep>=L.steps.length){
    if(mistakeQueue.length>0){
      inRetryMode=true;
      S.currentStep=mistakeQueue.shift();
      renderStep();window.scrollTo(0,0);
    } else {
      completeLesson();
    }
    return;
  }
  document.getElementById('header-fill').style.width=Math.round((S.currentStep/L.steps.length)*100)+'%';
  renderStep();window.scrollTo(0,0);
}

function completeLesson(){
  S.xp+=S.sxp;
  S.totalDone++;
  S.modDone[S.currentMod]=(S.modDone[S.currentMod]||0)+1;
  localStorage.setItem('sq_xp',S.xp);
  localStorage.setItem('sq_total_done',S.totalDone);
  localStorage.setItem('sq_mod_done',JSON.stringify(S.modDone));
  document.getElementById('earned-val').textContent='+'+S.sxp;
  document.getElementById('complete-msg').textContent=modules[S.currentMod].lessons[S.currentLesson].msg;
  updateHome();show('complete');
}

function startLesson(){
  const mod=modules[S.currentMod];
  const nextLesson=S.modDone[S.currentMod]||0;
  if(nextLesson>=mod.lessons.length){S.currentLesson=0;}
  else{S.currentLesson=nextLesson;}
  S.currentStep=0;S.sxp=0;
  mistakeQueue=[];inRetryMode=false;
  document.getElementById('session-xp').textContent='0';
  show('lesson');renderStep();
}

function goHome(){updateHome();show('home');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function renderModuleTabs(){
  const tabs=document.getElementById('module-tabs');
  tabs.innerHTML=modules.map((m,i)=>`<div class="module-tab${i===S.currentMod?' active':''}" onclick="selectMod(${i})">${i+1}. ${m.name}</div>`).join('');
}

function selectMod(idx){
  S.currentMod=idx;
  renderModuleTabs();
  renderModuleCard();
}

function renderModuleCard(){
  const mod=modules[S.currentMod];
  const done=S.modDone[S.currentMod]||0;
  const pct=Math.round((done/mod.lessons.length)*100);
  document.getElementById('mod-progress-label').textContent=`Module ${S.currentMod+1} progress`;
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=pct+'%';
  const lessonsHTML=mod.lessons.map((l,i)=>{
    const isDone=i<done;
    return `<div class="lesson-row">
      <div class="lesson-dot${isDone?' done':''}">${isDone?'✓':i+1}</div>
      <div class="lesson-name">${l.title}</div>
      <div class="lesson-meta">${isDone?'Done ✓':l.steps.length+' activities'}</div>
    </div>`;
  }).join('');
  const allDone=done>=mod.lessons.length;
  const testPassed=done>mod.lessons.length;
  document.getElementById('module-card').innerHTML=`
    <div class="module-tag">📦 Module ${S.currentMod+1}</div>
    <div class="module-name">${mod.name}</div>
    <div class="module-desc">${mod.desc}</div>
    <div class="lesson-list">${lessonsHTML}</div>
    <button class="btn-start" id="btn-start" onclick="startLesson()" ${allDone?'disabled':''}>
      ${allDone?'All lessons done! ✓':done>0?'Continue →':"Let us go →"}
    </button>
    ${allDone?`<button class="test-btn" onclick="startTest()" ${testPassed?'disabled':''}>
      ${testPassed?'✓ Module Test Passed':'🎯 Take the Module Test'}
    </button>`:''}
  `;
}

function getLessonHint(){
  const mod=modules[S.currentMod];
  const lesson=mod.lessons[S.currentLesson];
  const hint=lessonHints[lesson.title];
  if(!hint)return null;
  return hint;
}

function toggleInfo(){
  const panel=document.getElementById('info-panel');
  if(panel)panel.classList.toggle('show');
}

function startTest(){
  const mod=modules[S.currentMod];
  const allSteps=[];
  mod.lessons.forEach((lesson,li)=>{
    lesson.steps.forEach((step,si)=>{
      if(step.type!=='story'){
        allSteps.push({...step,lessonTitle:lesson.title,lessonIdx:li,stepIdx:si});
      }
    });
  });
  const shuffled=[...allSteps].sort(()=>Math.random()-0.5);
  testState.questions=shuffled.slice(0,20);
  testState.current=0;
  testState.answers=[];
  testState.wrongAnswers=[];
  show('test');
  renderTestStep();
}

function renderTestStep(){
  const q=testState.questions[testState.current];
  const total=testState.questions.length;
  const pct=Math.round((testState.current/total)*100);
  document.getElementById('test-fill').style.width=pct+'%';
  document.getElementById('test-q-num').textContent=testState.current+1;
  document.getElementById('test-q-total').textContent=total;
  const body=document.getElementById('test-body');
  let h=`<div class="lesson-tag">Module Test · Question ${testState.current+1} of ${total}</div>
  <div class="lesson-heading" style="font-size:20px;margin-bottom:20px;">No hints. One chance.</div>`;
  if(q.type==='choice'){
    h+=`<div class="activity-card"><div class="act-type">Choose the correct answer</div><div class="act-q">${q.q}</div><div class="options">${q.opts.map((o,i)=>`<button class="opt" onclick="answerTest(${i})" id="topt${i}"><span class="opt-ic" id="tic${i}">○</span>${o}</button>`).join('')}</div></div>`;
    body.innerHTML=h;
  } else if(q.type==='drag'){
    const sh=[...q.words].sort(()=>Math.random()-0.5);
    h+=`<div class="activity-card"><div class="act-type">Arrange in the right order</div><div class="act-q">${q.q}</div><div class="drop-zone" id="tdzone"><span class="zone-hint" id="tzhint">Tap words below</span></div><div class="word-bank">${sh.map((w,i)=>`<div class="drag-word" id="tdw${i}" onclick="tapTestW('${w}',${i})">${w}</div>`).join('')}</div></div><button class="btn-check show" onclick="checkTestDrag()">Check answer</button>`;
    body.innerHTML=h;
    testState.testPlaced=[];
  } else if(q.type==='fill'){
    h+=`<div class="activity-card"><div class="act-type">Fill in the blank</div><div class="act-q">${q.q}</div><div class="code-template">${q.template.replace('___','<span class="blank-span">___</span>')}</div><input class="fill-input" id="tfin" placeholder="Type your answer..." oninput="onTestType()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/></div><button class="btn-check show" id="tbcheck" onclick="checkTestFill()" disabled>Check answer</button>`;
    body.innerHTML=h;
  }
  window.scrollTo(0,0);
}

function answerTest(idx){
  const q=testState.questions[testState.current];
  const ok=idx===q.correct;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  document.getElementById('tic'+idx).textContent=ok?'✓':'✗';
  document.getElementById('topt'+idx).classList.add(ok?'correct':'wrong');
  if(!ok){
    document.getElementById('topt'+q.correct).classList.add('correct');
    document.getElementById('topt'+q.correct).classList.remove('disabled');
    document.getElementById('tic'+q.correct).textContent='✓';
    testState.wrongAnswers.push({q:q.q,correct:q.opts[q.correct]});
  }
  testState.answers.push(ok);
  setTimeout(()=>nextTestStep(),1200);
}

function tapTestW(word,idx){
  const el=document.getElementById('tdw'+idx);
  if(el.classList.contains('used'))return;
  el.classList.add('used');
  const zone=document.getElementById('tdzone'),hint=document.getElementById('tzhint');
  if(hint)hint.remove();
  const pw=document.createElement('div');pw.className='placed-word';pw.textContent=word;
  pw.onclick=()=>{pw.remove();el.classList.remove('used');testState.testPlaced=testState.testPlaced.filter(p=>p.idx!==idx);};
  zone.appendChild(pw);
  testState.testPlaced=testState.testPlaced||[];
  testState.testPlaced.push({word,idx});
}

function checkTestDrag(){
  const q=testState.questions[testState.current];
  const placed=(testState.testPlaced||[]).map(p=>p.word);
  const ok=JSON.stringify(placed)===JSON.stringify(q.correct);
  if(!ok)testState.wrongAnswers.push({q:q.q,correct:q.correct.join(' ')});
  testState.answers.push(ok);
  nextTestStep();
}

function onTestType(){
  document.getElementById('tbcheck').disabled=!document.getElementById('tfin').value.trim();
}

function checkTestFill(){
  const q=testState.questions[testState.current];
  const val=document.getElementById('tfin').value.trim().toLowerCase();
  const answers=Array.isArray(q.answer)?q.answer.map(a=>a.toLowerCase()):[q.answer.toLowerCase()];
  const ok=answers.includes(val);
  if(!ok)testState.wrongAnswers.push({q:q.q,correct:q.answer});
  testState.answers.push(ok);
  nextTestStep();
}

function nextTestStep(){
  testState.current++;
  if(testState.current>=testState.questions.length){
    showTestResult();return;
  }
  renderTestStep();
}

function showTestResult(){
  const correct=testState.answers.filter(a=>a).length;
  const total=testState.questions.length;
  const pct=Math.round((correct/total)*100);
  const passed=pct>=80;
  document.getElementById('result-emoji').textContent=passed?'🏆':'💪';
  document.getElementById('result-title').textContent=passed?'Module Complete!':'Not quite — keep going!';
  document.getElementById('result-msg').textContent=passed?
    `You scored ${pct}% — outstanding! You have earned a bonus +100 XP.`:
    `You scored ${pct}%. You need 80% to pass. Review the lessons and try again — you are close!`;
  const scoreEl=document.getElementById('result-score');
  scoreEl.textContent=correct+'/'+total;
  scoreEl.className='test-score'+(passed?'':' fail');
  if(passed){
    S.xp+=100;
    localStorage.setItem('sq_xp',S.xp);
    S.modDone[S.currentMod]=modules[S.currentMod].lessons.length+1;
    localStorage.setItem('sq_mod_done',JSON.stringify(S.modDone));
  }
  const wrongWrap=document.getElementById('wrong-answers-wrap');
  const wrongList=document.getElementById('wrong-answers-list');
  if(testState.wrongAnswers.length>0){
    wrongWrap.style.display='block';
    wrongList.innerHTML=testState.wrongAnswers.map(w=>`
      <div class="wrong-review">
        <div class="wrong-review-q">${w.q}</div>
        <div class="wrong-review-correct">Correct answer: <span>${w.correct}</span></div>
      </div>`).join('');
  } else {
    wrongWrap.style.display='none';
  }
  const btn=document.getElementById('result-btn');
  btn.textContent=passed?'Continue to next module →':'Retake test';
  updateHome();
  show('test-result');
}

function handleResultBtn(){
  const passed=testState.answers.filter(a=>a).length/testState.questions.length>=0.8;
  if(passed){goHome();}
  else{startTest();}
}

function updateHome(){
  document.getElementById('xp-display').textContent=S.xp;
  document.getElementById('streak-display').textContent=S.streak+'🔥';
  document.getElementById('done-display').textContent=S.totalDone;
  renderModuleTabs();
  renderModuleCard();
}

updateHome();
setTimeout(()=>{
  const done=S.modDone[S.currentMod]||0;
  const pct=Math.round((done/modules[S.currentMod].lessons.length)*100);
  document.getElementById('progress-bar').style.width=pct+'%';
},300);
</script>
</body>
</html>
